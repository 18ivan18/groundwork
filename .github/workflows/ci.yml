name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: groundwork
          POSTGRES_PASSWORD: groundwork
          POSTGRES_DB: groundwork
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U groundwork -d groundwork"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # The `db` tests must run here, not skip.
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src scripts eval
      - run: uv run pytest

  # The retrieval regression gate: Success@6 per collection against eval/baseline.json, with
  # exact vector search so the result does not depend on the HNSW graph.
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: groundwork
          POSTGRES_PASSWORD: groundwork
          POSTGRES_DB: groundwork
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U groundwork -d groundwork"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      # The embedder and the re-ranker, about 200 MB, downloaded once per lock file.
      - uses: actions/cache@v5
        with:
          path: .fastembed
          key: fastembed-${{ hashFiles('backend/uv.lock') }}
      # The corpora, downloaded once per corpora version. The gate still verifies every file's hash.
      - uses: actions/cache@v5
        with:
          path: backend/data/raw
          key: corpora-${{ hashFiles('backend/conf/corpora.lock.json') }}
      - run: uv run alembic upgrade head
      - run: uv run python eval/run_eval.py --ci

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Builds both images without pushing them, so a broken Dockerfile fails the pull request
  # rather than the first `docker compose up`.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag groundwork-api ./backend
      - run: docker build --tag groundwork-web ./frontend
