# Compose project name: fixed so volumes and containers keep their names whatever the folder is called.
name: groundwork


x-backend: &backend
  image: groundwork-api
  env_file: .env
  environment:
    # Override .env, whose values are for running outside Docker.
    DATA_DIR: /app/data
    DATABASE_URL: postgresql://groundwork:groundwork@db:5432/groundwork
  volumes:
    - data:/app/data

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: groundwork
      # Local only: the port is bound to 127.0.0.1.
      POSTGRES_PASSWORD: groundwork
      POSTGRES_DB: groundwork
    # 5434 on the host, because 5432 is often taken by a local Postgres.
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundwork -d groundwork"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Applies the migrations, then exits.
  migrate:
    <<: *backend
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  # Queues data/raw/ for the worker and exits. Files already indexed or queued are skipped.
  ingest:
    <<: *backend
    pull_policy: never
    command: ["python", "scripts/ingest.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Indexes queued files: the corpus, and uploads. Its own service, so a job carries on while
  # the API restarts; a job whose worker dies is taken back by the next one to start.
  worker:
    <<: *backend
    pull_policy: never
    command: ["python", "-m", "groundwork.ingestion.worker"]
    # About 850 MB while embedding a large filing.
    mem_limit: 2g
    depends_on:
      ingest:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    <<: *backend
    # Uses the image that `ingest` builds. Building it in both would race on the same tag.
    pull_policy: never
    # Two workers, to keep any in-process state from becoming load-bearing (#43): users, jobs,
    # the index and its generation all live in Postgres, BM25 on the shared volume.
    command:
      [
        "uvicorn", "groundwork.main:create_app", "--factory",
        "--host", "0.0.0.0", "--port", "8000", "--workers", "2",
      ]
    # Each worker loads the embedder and the re-ranker (about 300 MB) and BM25 for the corpus.
    mem_limit: 2g
    depends_on:
      ingest:
        condition: service_completed_successfully
    healthcheck:
      # Python because the slim image has no curl. Uvicorn only answers once startup has finished.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  web:
    build: ./frontend
    image: groundwork-web
    # Local only: the app has no authentication.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Optional local LLM: docker compose --profile local-llm up --build
  # Then pull a model: docker compose exec ollama ollama pull <model>
  ollama:
    profiles: ["local-llm"]
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  data:
  pgdata:
  ollama:
