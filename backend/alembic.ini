# Migrations are hand-written SQL (op.execute), no ORM models: see D18 in docs/HANDOFF.md.
# The database URL comes from DATABASE_URL (Settings), not from this file.
[alembic]
script_location = groundwork.db:migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
